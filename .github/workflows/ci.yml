name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # v2.7.x — ``--group youtube`` pulls google-api-python-client +
        # google-auth + google-auth-oauthlib so tests/web/test_youtube_*
        # can import the real ``googleapiclient`` namespace. Without it
        # the entire YT test suite fails at module-import time with
        # ModuleNotFoundError.
        run: uv sync --all-extras --group web --group dev --group youtube

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        working-directory: web/frontend
        run: npm ci

      - name: Test
        working-directory: web/frontend
        run: npm test

      # The production build is a separate failure mode from the unit tests:
      # `next build` prerenders every route, and a client-only hook such as
      # useSearchParams() without a Suspense boundary fails there and ONLY
      # there — `next dev` never notices. This step exists because that break
      # shipped to main undetected.
      - name: Build
        working-directory: web/frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: e2e-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-extras --group web --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: web/frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 14

  algorave:
    name: Algorave spike (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: the spike needs `registerHooks`, which Node 18 does
      # not have and which is why jarvis runs 22 via nvm. Kept separate from
      # the Frontend job for that reason alone.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scripts/algorave-spike/package-lock.json

      - name: Install
        working-directory: scripts/algorave-spike
        run: npm ci

      # This suite carries the validator, the pen, B2B and the palette rules —
      # the vocabulary §11 S5-S7 move into the app. Until now none of it ran in
      # CI, which is how #147 came to find 28 validator tests that a fresh
      # install had silently stopped executing.
      #
      # Expected: 5 files / 129 tests passing, plus test/wav.test.mjs skipping
      # itself in full — it is `describe.skipIf(!present)` over a rendered WAV
      # that CI has no reason to produce. A DROP in the passing count is the
      # thing to look at; that skip is not.
      - name: Test
        working-directory: scripts/algorave-spike
        run: npx vitest run
