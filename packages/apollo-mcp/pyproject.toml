[project]
name = "apollo-mcp"
version = "0.1.0"
description = "MCP server over Apollo's REST API: generate with ACE-Step, poll, download and review takes"
readme = "README.md"
requires-python = ">=3.10"
# Standalone on purpose, like packages/py-obs: the MCP is a CLIENT of a
# running Apollo, so it must not import the backend (or librosa, moviepy…)
# to talk to it. Two dependencies, both small.
dependencies = [
    "mcp>=2.3,<3",  # v2: FastMCP became MCPServer
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
apollo-mcp = "apollo_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
